name: Auto Update
on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
concurrency:
  group: auto-update
  cancel-in-progress: true
jobs:
  update-files:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"
          cache: pip
          cache-dependency-path: source/requirements.txt
      - name: Install dependencies
        run: cd source && pip install -r requirements.txt
      - name: Run script
        env:
          MY_TOKEN: ${{ secrets.PAT_TOKEN }}
          GIT_AUTHOR_NAME: "github-actions[bot]"
          GIT_AUTHOR_EMAIL: "github-actions[bot]@users.noreply.github.com"
          GIT_COMMITTER_NAME: "github-actions[bot]"
          GIT_COMMITTER_EMAIL: "github-actions[bot]@users.noreply.github.com"
        run: cd source && python main.py

      # ========== 新增：自动清理 Auto Update 历史运行，只保留最新1条 ==========
      - name: Clean old Auto Update runs, keep only 1 latest
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: |
          # 工作流名称，和name保持一致
          WORKFLOW_NAME="Auto Update"
          REPO=${{ github.repository }}
          # 获取已完成的run列表，按创建时间倒序，过滤掉正在运行的
          RUNS=$(gh api -H "X-GitHub-Api-Version:2022-11-28" \
            "/repos/$REPO/actions/workflows/$WORKFLOW_NAME/runs" \
            --paginate \
            --jq '.workflow_runs[] | select(.conclusion != null) | .id')
          # 转为数组
          RUN_ARR=($RUNS)
          TOTAL=${#RUN_ARR[@]}
          echo "Total completed runs found: $TOTAL"
          if [[ $TOTAL -le 1 ]]; then
            echo "No old runs to delete."
            exit 0
          fi
          # 跳过第0个（最新一条），其余全部删除
          for ((i=1; i<TOTAL; i++)); do
            RUN_ID=${RUN_ARR[$i]}
            echo "Deleting run id: $RUN_ID"
            gh api --method DELETE -H "X-GitHub-Api-Version:2022-11-28" "/repos/$REPO/actions/runs/$RUN_ID" || true
            sleep 0.3
          done
