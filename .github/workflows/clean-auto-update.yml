name: Clean Auto Update Runs
on:
  schedule:
    - cron: "0 22 * * *"
  workflow_dispatch:

jobs:
  clean:
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    env:
      TOKEN: ${{ secrets.PAT_TOKEN }}
      REPO: sanchuner2000/goida-vpn-configs
      WF_ID_AUTO: 357466956
      WF_ID_MANUAL: 357466958
    steps:
      - name: Clean Auto Update workflow (keep 1 latest)
        run: |
          RAW=$(curl -s \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: token $TOKEN" \
            "https://api.github.com/repos/$REPO/actions/workflows/$WF_ID_AUTO/runs?per_page=100")
          DEL_IDS=$(echo "$RAW" | jq -r '.workflow_runs // [] | map(select(.conclusion != null)) | .[1:][].id')
          echo "Auto Update 待删除RUN："
          echo "$DEL_IDS"
          echo "$DEL_IDS" | while read -r rid; do
            if [ -n "$rid" ];then
              echo ">> 删除 run: $rid"
              curl -s -X DELETE \
                -H "Accept: application/vnd.github+json" \
                -H "Authorization: token $TOKEN" \
                "https://api.github.com/repos/$REPO/actions/runs/$rid"
              sleep 0.3
            fi
          done

      - name: Clean Manual workflow (keep 1 latest)
        run: |
          RAW=$(curl -s \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: token $TOKEN" \
            "https://api.github.com/repos/$REPO/actions/workflows/$WF_ID_MANUAL/runs?per_page=100")
          DEL_IDS=$(echo "$RAW" | jq -r '.workflow_runs // [] | map(select(.conclusion != null)) | .[1:][].id')
          echo "Manual 待删除RUN："
          echo "$DEL_IDS"
          echo "$DEL_IDS" | while read -r rid; do
            if [ -n "$rid" ];then
              echo ">> 删除 run: $rid"
              curl -s -X DELETE \
                -H "Accept: application/vnd.github+json" \
                -H "Authorization: token $TOKEN" \
                "https://api.github.com/repos/$REPO/actions/runs/$rid"
              sleep 0.3
            fi
          done

      - name: Clean self Clean Auto Update Runs (delete all finished, keep 0)
        run: |
          RAW=$(curl -s \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: token $TOKEN" \
            "https://api.github.com/repos/$REPO/actions/workflows/${{ github.workflow_id }}/runs?per_page=100")
          DEL_IDS=$(echo "$RAW" | jq -r '.workflow_runs // [] | map(select(.conclusion != null)) | .[0:][].id')
          echo "Clean自身 待删除RUN："
          echo "$DEL_IDS"
          echo "$DEL_IDS" | while read -r rid; do
            if [ -n "$rid" ];then
              echo ">> 删除 run: $rid"
              curl -s -X DELETE \
                -H "Accept: application/vnd.github+json" \
                -H "Authorization: token $TOKEN" \
                "https://api.github.com/repos/$REPO/actions/runs/$rid"
              sleep 0.3
            fi
          done
