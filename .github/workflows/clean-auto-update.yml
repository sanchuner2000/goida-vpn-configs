name: Clean Auto Update Runs
on:
  schedule:
    - cron: "0 22 * * *"
  workflow_dispatch:

jobs:
  clean:
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    env:
      TOKEN: ${{ secrets.PAT_TOKEN }}
      REPO: sanchuner2000/goida-vpn-configs
      WF_ID_AUTO: 357466956
      WF_ID_MANUAL: 357466958
    steps:
      - name: Clean workflow runs
        run: |
          # ========== Auto Update：保留最新1条，其余删除 ==========
          echo "===== Processing Auto Update ====="
          RAW=$(curl -s \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: token $TOKEN" \
            "https://api.github.com/repos/$REPO/actions/workflows/$WF_ID_AUTO/runs?per_page=100")
          IDS=$(echo "$RAW" | jq -r '.workflow_runs | map(select(.conclusion != null)) | sort_by(-(.created_at | fromdateiso8601)) | .[1:][].id')
          echo "$IDS" | while read rid; do
            if [ -n "$rid" ];then
              echo "Delete AutoUpdate run id: $rid"
              curl -s -X DELETE \
                -H "Accept: application/vnd.github+json" \
                -H "Authorization: token $TOKEN" \
                "https://api.github.com/repos/$REPO/actions/runs/$rid"
              sleep 0.3
            fi
          done

          # ========== Manual Update：保留最新1条，其余删除 ==========
          echo -e "\n===== Processing Manual Update ====="
          RAW_MANUAL=$(curl -s \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: token $TOKEN" \
            "https://api.github.com/repos/$REPO/actions/workflows/$WF_ID_MANUAL/runs?per_page=100")
          IDS_MANUAL=$(echo "$RAW_MANUAL" | jq -r '.workflow_runs | map(select(.conclusion != null)) | sort_by(-(.created_at | fromdateiso8601)) | .[1:][].id')
          echo "$IDS_MANUAL" | while read rid; do
            if [ -n "$rid" ];then
              echo "Delete ManualUpdate run id: $rid"
              curl -s -X DELETE \
                -H "Accept: application/vnd.github+json" \
                -H "Authorization: token $TOKEN" \
                "https://api.github.com/repos/$REPO/actions/runs/$rid"
              sleep 0.3
            fi
          done

          # ========== Clean自身工作流：全部删除已完成run ==========
          echo -e "\n===== Processing Clean Auto Update Runs (self) ====="
          SELF_RAW=$(curl -s \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: token $TOKEN" \
            "https://api.github.com/repos/$REPO/actions/workflows/${{ github.workflow_id }}/runs?per_page=100")
          SELF_IDS=$(echo "$SELF_RAW" | jq -r '.workflow_runs | map(select(.conclusion != null)) | sort_by(-(.created_at | fromdateiso8601)) | .[].id')
          echo "$SELF_IDS" | while read rid; do
            if [ -n "$rid" ];then
              echo "Delete Self run id: $rid"
              curl -s -X DELETE \
                -H "Accept: application/vnd.github+json" \
                -H "Authorization: token $TOKEN" \
                "https://api.github.com/repos/$REPO/actions/runs/$rid"
              sleep 0.3
            fi
          done
          echo -e "\n✅ 全部清理任务执行完成"
