name: Clean Auto Update Runs
on:
  schedule:
    - cron: "0 22 * * *"
  workflow_dispatch:

jobs:
  clean:
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    env:
      TOKEN: ${{ secrets.PAT_TOKEN }}
      REPO: sanchuner2000/goida-vpn-configs
      WF_ID_AUTO: 357466956
      WF_ID_MANUAL: 357466958
    steps:
      - name: Clean workflow runs
        run: |
          del_runs() {
            WORKFLOW_ID=$1
            KEEP_NUM=$2
            echo -e "\n===== Processing Workflow ID: $WORKFLOW_ID , keep $KEEP_NUM ====="
            RAW=$(curl -s \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: token $TOKEN" \
              "https://api.github.com/repos/$REPO/actions/workflows/$WORKFLOW_ID/runs?per_page=100")
            # API返回：最新记录在数组头部
            # jq直接切片：跳过前KEEP_NUM条，取出后面所有待删id
            DEL_IDS=$(echo "$RAW" | jq -r '.workflow_runs // [] | map(select(.conclusion != null)) | .[$KEEP_NUM:][].id')
            echo "Runs to delete:"
            echo "$DEL_IDS"
            echo "$DEL_IDS" | while read -r rid; do
              if [ -n "$rid" ];then
                echo ">> Deleting run id: $rid"
                curl -s -X DELETE \
                  -H "Accept: application/vnd.github+json" \
                  -H "Authorization: token $TOKEN" \
                  "https://api.github.com/repos/$REPO/actions/runs/$rid"
                sleep 0.3
              fi
            done
          }

          # Auto Update：保留最新1条
          del_runs $WF_ID_AUTO 1
          # Manual Update：保留最新1条
          del_runs $WF_ID_MANUAL 1
          # Clean自身：全部删除已完成记录，保留0条
          del_runs ${{ github.workflow_id }} 0

          echo -e "\n✅ 全部清理任务执行完成"
